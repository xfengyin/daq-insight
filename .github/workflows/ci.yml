name: CI

on: [push]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install
        # lockfile 与 package.json 的 peer 范围不一致（vite@8 vs plugin-react@4.7），
        # npm ci 会 ERESOLVE；用 legacy-peer-deps 按现 lock 安装（2026-10-26 实测红过一次）
        run: npm ci --legacy-peer-deps
      - name: vitest
        run: npx vitest run
