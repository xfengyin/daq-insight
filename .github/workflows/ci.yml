name: CI

# P3：PR 上也要跑，否则「合并不看 CI」永远无从谈起。
# 注意：加了触发 ≠ 有门禁 —— 门禁由分支保护的 required_status_checks 决定，见同名 PR 描述。
on:
  push:
    branches: [main]   # 只有 main 的 push 才跑：特性分支不再与 pull_request 撞出同名 check-run
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install
        run: npm ci --legacy-peer-deps
      - name: 生成测试夹具（large.csv 等程序化样本）
        run: npm run gen:fixtures
      - name: vitest
        run: npx vitest run
