name: CI

# P3：PR 上也要跑，否则「合并不看 CI」永远无从谈起。
# 注意：加了触发 ≠ 有门禁 —— 门禁由分支保护的 required_status_checks 决定，见同名 PR 描述。
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 探针：故意让 CI 红。只存在于取证分支，PR 验完即关、分支即删。
      - name: 探针：故意失败（取证用）
        run: |
          echo "::error::探针步骤故意失败：验证 required_status_checks + enforce_admins 是否真挡人"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install
        run: npm ci --legacy-peer-deps
      - name: 生成测试夹具（large.csv 等程序化样本）
        run: npm run gen:fixtures
      - name: vitest
        run: npx vitest run
