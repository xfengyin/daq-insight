# DAQ Insight — Windows 安装包构建工作流
# 触发：推送 main / v* 标签 / 手动触发；产物：NSIS 安装包 + blockmap + latest.yml
name: Build Windows Installer

"on":
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Gitea only evaluates a job-level `if` for jobs with `needs`. This no-op job
  # (no action downloads) gives build-win a dependency so the `if` below is
  # actually evaluated on Gitea: build-win is skipped there, runs on GitHub.
  preflight:
    name: Preflight
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'amd64' }}
    steps:
      - name: No-op preflight
        run: echo "preflight ok"

  build-win:
    needs: preflight
    # Gitea has no windows runner: this job only runs on GitHub
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 国内网络加速（electron / 打包工具二进制走 npmmirror 镜像）
      - name: Set Electron mirrors
        shell: bash
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: echo "ELECTRON_MIRROR=$ELECTRON_MIRROR" >> "$GITHUB_ENV"

      - name: Cache electron-builder cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.os == 'Windows' && format('{0}\AppData\Local\electron-builder\Cache', env.LOCALAPPDATA) }}
            ~/.cache/electron
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (NSIS x64)
        env:
          # 代码签名（可选）：未配置 secrets 时跳过签名（electron-builder 自动发现）
          # 仓库 Secrets 中配置 CSC_LINK（base64 或路径）与 CSC_KEY_PASSWORD 即可启用 Authenticode 签名
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run build:win

      - name: Upload NSIS installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daq-insight-win-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Upload release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
